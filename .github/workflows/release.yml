name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-15
            name: macos-arm64
            arch: arm64
          - os: macos-15-intel
            name: macos-x64
            arch: x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})

    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: bash
        run: |
          VER="${GITHUB_REF#refs/tags/v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcups2-dev

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.3'

      - name: Configure
        shell: bash
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
          MACOS_ARCH: ${{ matrix.arch }}
        run: |
          args=(-DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release "-DAPP_VERSION=$APP_VERSION")
          if [[ "$RUNNER_OS" == macOS ]]; then
            args+=(-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 "-DCMAKE_OSX_ARCHITECTURES=$MACOS_ARCH")
          fi
          cmake -B build "${args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: cd build && QT_QPA_PLATFORM=offscreen ctest -V

      - name: Test (non-Linux)
        if: runner.os != 'Linux'
        run: cd build && ctest -V -C Release

      - name: Install linuxdeployqt (Linux)
        if: runner.os == 'Linux'
        run: |
          wget -q https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage -O linuxdeployqt
          chmod +x linuxdeployqt

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          cp build/ymind dist/
          cp build/ymind-cli dist/
          chmod +x dist/ymind dist/ymind-cli
          # `-executable=` makes linuxdeployqt fix up ymind-cli's RPATH alongside
          # ymind's, so both binaries can find the bundled Qt libs in the tarball.
          ./linuxdeployqt dist/ymind -executable=dist/ymind-cli -verbose=1
          tar czf ymind-${{ matrix.name }}.tar.gz -C dist .

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/Release/ymind.exe dist/
          cp build/Release/ymind-cli.exe dist/
          # Run windeployqt against both: ymind-cli is headless, so it may pull
          # a slightly different plugin set than the GUI binary.
          windeployqt dist/ymind.exe || true
          windeployqt dist/ymind-cli.exe || true
          7z a ymind-${{ matrix.name }}.zip ./dist/*

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          bash packaging/macos/package.sh build dist
          python3 packaging/macos/verify_bundle.py dist/YMind.app --minimum 11.0 --architectures '${{ matrix.arch }}'

      - name: Test packaged app (macOS)
        if: runner.os == 'macOS'
        run: |
          # Move away from the build/install paths and retain spaces in the path.
          mkdir -p 'package check'
          mv dist/YMind.app 'package check/YMind.app'
          python3 packaging/macos/smoke_test.py 'package check/YMind.app'
          mv 'package check/YMind.app' dist/YMind.app

      - name: Create archives (macOS)
        if: runner.os == 'macOS'
        run: |
          tar czf ymind-${{ matrix.name }}.tar.gz -C dist .
          ln -s /Applications dist/Applications
          hdiutil create -volname YMind -srcfolder dist -ov -format UDZO ymind-${{ matrix.name }}.dmg

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ymind-${{ matrix.name }}
          path: ymind-${{ matrix.name }}.*

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for changelog)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version and previous tag
        id: meta
        shell: bash
        run: |
          CURRENT_TAG="${GITHUB_REF#refs/tags/}"
          echo "current_tag=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          # Find the most recent v* tag before the current one (by version sort)
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname \
                      | grep -v "^${CURRENT_TAG}$" \
                      | head -1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          chmod +x .github/scripts/generate-changelog.sh
          .github/scripts/generate-changelog.sh \
            "${{ steps.meta.outputs.prev_tag }}" \
            "${{ steps.meta.outputs.current_tag }}" \
            > release_notes.md
          echo "----- release_notes.md -----"
          cat release_notes.md

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: artifacts/*
